<!DOCTYPE html>
<html lang="es">
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1fb6a6">
<link rel="apple-touch-icon" href="icon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>First English - Campus Virtual</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-teal': '#1fb6a6',
                        'brand-yellow': '#fbc02d',
                        'brand-navy': '#0d2238',
                        'brand-light': '#ffffff'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800;900&display=swap');
        
        html { font-size: 115%; }
        
        body { font-family: 'Nunito', sans-serif; background-color: #0d2238; color: #1e293b; -webkit-font-smoothing: antialiased; scroll-behavior: smooth; }
        
        .app-container { width: 100%; height: 100vh; display: flex; flex-direction: column; position: relative; margin: 0 auto; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .btn-active:active { transform: scale(0.95); }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
        .calendar-day { aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-weight: 800; font-size: 0.85rem; position: relative; cursor: pointer; transition: all 0.2s; }
        .calendar-day:active { transform: scale(0.9); }
        
        input, select, textarea { font-size: 1rem !important; border: 2px solid #e2e8f0; }
        input:focus, textarea:focus { border-color: #1fb6a6 !important; outline: none; }
        
        [contenteditable]:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            font-style: italic;
        }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: white; padding-bottom: env(safe-area-inset-bottom); z-index: 40; transition: all 0.3s ease;}
        @media (min-width: 768px) {
            .bottom-nav { width: max-content; left: 50%; transform: translateX(-50%); bottom: 24px; border-radius: 3rem; padding: 1rem 3rem; box-shadow: 0 15px 40px rgba(0,0,0,0.15); border: 1px solid #f1f5f9; }
        }

        .active-nav { color: #1fb6a6 !important; }
        
        .highlight-task {
            animation: highlight-fade 2.5s ease-out;
            border-color: #fbc02d !important;
            transform: scale(1.02);
            z-index: 10;
        }
        @keyframes highlight-fade { 
            0% { background-color: #fff9c4; box-shadow: 0 0 0 4px #fbc02d; } 
            70% { background-color: #fff9c4; box-shadow: 0 0 0 2px rgba(251, 192, 45, 0.5); }
            100% { background-color: white; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); transform: scale(1); } 
        }

        /* Estilos específicos para la libreta */
        .gradebook-table th { position: sticky; top: 0; z-index: 10; }
        .gradebook-input::-webkit-inner-spin-button, .gradebook-input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .gradebook-input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body class="bg-brand-navy overflow-hidden">
<div id="install-banner" style="display: none; background: #1fb6a6; color: white; padding: 15px; text-align: center; position: fixed; bottom: 0; left: 0; width: 100%; z-index: 100; font-family: 'Nunito', sans-serif; box-shadow: 0 -5px 20px rgba(0,0,0,0.2);">
    <span style="font-weight: 800; font-size: 14px;">¡INSTALA EL CAMPUS EN TU CELULAR!</span>
    <button id="install-button" style="background: #fbc02d; color: #0d2238; border: none; padding: 8px 20px; margin-left: 15px; border-radius: 12px; cursor: pointer; font-weight: 900; text-transform: uppercase; font-size: 12px;">
        INSTALAR
    </button>
</div>
    <div class="app-container bg-slate-50 shadow-2xl overflow-hidden">
        
        <div id="view-login" class="flex-1 flex flex-col items-center justify-center p-8 bg-brand-navy z-50 w-full">
            <div class="w-32 h-32 bg-brand-teal rounded-full flex items-center justify-center border-4 border-brand-yellow mb-6 shadow-xl">
                <span class="text-6xl font-black text-white">1</span>
            </div>
            <h1 class="text-4xl font-black text-white mb-1 uppercase tracking-tighter text-center">First <span class="text-brand-yellow">English</span></h1>
            <p class="text-brand-teal font-bold text-sm tracking-[0.3em] mb-10 uppercase text-center">Academic Excellence</p>
            
            <div class="w-full max-w-sm space-y-4">
                <input id="input-code" type="text" placeholder="IDENTIFICADOR / PIN DE VERIFICACIÓN" class="w-full py-4 px-6 rounded-2xl bg-white text-brand-navy text-center font-black tracking-widest outline-none shadow-sm">
                <button onclick="handleLogin()" class="w-full bg-brand-yellow text-brand-navy font-black py-4 rounded-2xl shadow-lg btn-active uppercase tracking-widest hover:brightness-105 transition-all">Entrar</button>
            </div>
            <a id="btn-whatsapp-float" href="#" target="_blank" class="mt-10 flex items-center gap-3 bg-green-500 hover:bg-green-400 transition-colors text-white px-6 py-3 rounded-full font-bold shadow-lg text-lg"><i class="fa-brands fa-whatsapp text-2xl"></i> Ayuda</a>
        </div>

        <div id="view-app" class="hidden flex-1 flex flex-col overflow-hidden w-full">
            <header class="bg-brand-navy p-5 pt-8 rounded-b-[2.5rem] shadow-xl text-white relative z-10 w-full">
                <div class="flex justify-between items-center max-w-7xl mx-auto w-full">
                    <div class="flex items-center gap-3">
                        <div id="avatar" class="w-12 h-12 md:w-14 md:h-14 bg-brand-teal rounded-full flex items-center justify-center border-2 border-brand-yellow font-black text-2xl shadow-inner">?</div>
                        <div>
                            <h2 id="display-name" class="font-black text-xl md:text-2xl leading-none uppercase truncate w-40 md:w-auto max-w-[200px] md:max-w-md">Usuario</h2>
                            <p id="display-role" class="text-xs md:text-sm text-brand-teal font-bold uppercase tracking-widest mt-1 italic">Cargando...</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button id="btn-student-settings" onclick="modalStudentSettings()" class="hidden w-10 h-10 md:w-12 md:h-12 bg-white/10 rounded-xl flex items-center justify-center border border-white/20 hover:bg-white/20 transition-colors shadow-sm"><i class="fa-solid fa-gear text-white text-xl"></i></button>
                        
                        <button onclick="location.reload()" class="w-10 h-10 md:w-12 md:h-12 bg-white/10 rounded-xl flex items-center justify-center border border-white/20 hover:bg-white/20 transition-colors shadow-sm"><i class="fa-solid fa-power-off text-brand-yellow text-xl"></i></button>
                    </div>
                </div>
            </header>

            <main id="app-content" class="flex-1 overflow-y-auto p-5 md:p-8 pb-32 md:pb-40 hide-scroll bg-slate-50 w-full"></main>

            <nav id="nav-teacher" class="hidden bottom-nav border-t border-slate-200 flex justify-around md:justify-center md:gap-10 p-4 rounded-t-[2.5rem] md:rounded-full shadow-[0_-10px_25px_rgba(0,0,0,0.1)]">
                <button onclick="renderTeacherDashboard()" id="t-nav-1" class="nav-btn flex flex-col items-center text-slate-400 hover:text-brand-teal transition-colors"><i class="fa-solid fa-calendar-check text-2xl md:text-3xl"></i><span class="text-xs font-bold mt-1 uppercase">Agenda</span></button>
                <button onclick="renderTeacherGrupos()" id="t-nav-7" class="nav-btn flex flex-col items-center text-slate-400 hover:text-brand-teal transition-colors"><i class="fa-solid fa-layer-group text-2xl md:text-3xl"></i><span class="text-xs font-bold mt-1 uppercase">Grupos</span></button>
                <button onclick="renderTeacherMateriales()" id="t-nav-6" class="nav-btn flex flex-col items-center text-slate-400 hover:text-brand-teal transition-colors"><i class="fa-solid fa-folder-open text-2xl md:text-3xl"></i><span class="text-xs font-bold mt-1 uppercase">Material</span></button>
                <button onclick="renderTeacherStudents()" id="t-nav-2" class="nav-btn flex flex-col items-center text-slate-400 hover:text-brand-teal transition-colors"><i class="fa-solid fa-user-group text-2xl md:text-3xl"></i><span class="text-xs font-bold mt-1 uppercase">Alumnos</span></button>
                <button onclick="renderTeacherGradesControl()" id="t-nav-4" class="nav-btn flex flex-col items-center text-slate-400 hover:text-brand-teal transition-colors"><i class="fa-solid fa-star text-2xl md:text-3xl"></i><span class="text-xs font-bold mt-1 uppercase">Notas</span></button>
                <button onclick="renderTeacherProfile()" id="t-nav-5" class="nav-btn flex flex-col items-center text-slate-400 hover:text-brand-teal transition-colors"><i class="fa-solid fa-sliders text-2xl md:text-3xl"></i><span class="text-xs font-bold mt-1 uppercase">Ajustes</span></button>
            </nav>

            <nav id="nav-student" class="hidden bottom-nav border-t border-slate-200 flex justify-around md:justify-center md:gap-16 p-4 rounded-t-[2.5rem] md:rounded-full shadow-[0_-10px_25px_rgba(0,0,0,0.1)]">
                <button onclick="renderStudentDashboard()" id="s-nav-1" class="nav-btn flex flex-col items-center text-slate-400 hover:text-brand-teal transition-colors"><i class="fa-solid fa-house text-2xl md:text-3xl"></i><span class="text-[11px] md:text-xs font-bold mt-1 uppercase">Inicio</span></button>
                <button onclick="renderStudentMateriales()" id="s-nav-4" class="nav-btn flex flex-col items-center text-slate-400 hover:text-brand-teal transition-colors"><i class="fa-solid fa-folder-open text-2xl md:text-3xl"></i><span class="text-[11px] md:text-xs font-bold mt-1 uppercase">Material</span></button>
                <button onclick="renderStudentGrades()" id="s-nav-3" class="nav-btn flex flex-col items-center text-slate-400 hover:text-brand-teal transition-colors"><i class="fa-solid fa-award text-2xl md:text-3xl"></i><span class="text-[11px] md:text-xs font-bold mt-1 uppercase">Mis Notas</span></button>
            </nav>
        </div>

        <div id="modal-overlay" class="hidden fixed inset-0 bg-brand-navy/95 z-[60] flex items-center justify-center backdrop-blur-sm transition-all duration-300">
            <div id="modal-box" class="bg-white relative shadow-2xl flex flex-col transition-all duration-300 w-[98vw] md:max-w-6xl h-[95vh] rounded-2xl md:rounded-[2rem] overflow-hidden">
                <button onclick="closeModal()" class="absolute top-3 right-3 md:top-5 md:right-5 text-slate-400 hover:text-red-500 z-50 transition-colors bg-white rounded-full w-10 h-10 flex items-center justify-center shadow-lg border border-slate-100">
                    <i class="fa-solid fa-xmark text-2xl"></i>
                </button>
                <div id="modal-content" class="overflow-y-auto hide-scroll w-full h-full"></div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('popstate', function(event) {
            const overlay = document.getElementById('modal-overlay');
            if (overlay && !overlay.classList.contains('hidden')) {
                overlay.classList.add('hidden');
            }
        });

        const firebaseConfig = {
            apiKey: "AIzaSyBS6eZ9RDfMo073b6cTFgwwqccflCa6VpY",
            authDomain: "englishinstitute-a8533.firebaseapp.com",
            databaseURL: "https://englishinstitute-a8533-default-rtdb.firebaseio.com",
            projectId: "englishinstitute-a8533",
            storageBucket: "englishinstitute-a8533.firebasestorage.app",
            messagingSenderId: "428855202948",
            appId: "1:428855202948:web:de7ccb1b1f754b46889ed1",
            measurementId: "G-9JH28RQFGJ"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage(); 
        
        let currentUser = null;
        let globalData = {};
        let currentMonth = new Date();

        db.ref().on('value', snap => {
            globalData = snap.val() || {};
            
            const wa = globalData.configuracion?.whatsapp || "59100000000";
            if(document.getElementById('btn-whatsapp-float')) document.getElementById('btn-whatsapp-float').href = `https://wa.me/${wa}`;
            
            if(currentUser) {
                if(document.getElementById('t-nav-1')?.classList.contains('active-nav')) renderTeacherDashboard();
                if(document.getElementById('s-nav-1')?.classList.contains('active-nav')) renderStudentDashboard();
                if(document.getElementById('t-nav-7')?.classList.contains('active-nav')) renderTeacherGrupos();
                
                if(document.getElementById('carpetas-container')) {
                    const currentFilter = document.getElementById('m-cur-filter')?.value || 'all';
                    renderCarpetas(currentFilter);
                }

                if(document.getElementById('grades-table-container')) {
                    const currentCourse = document.getElementById('g-cur')?.value;
                    if(currentCourse) renderGradesTable(currentCourse);
                }
            }
        });

        function setActiveNav(id) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active-nav'));
            if(document.getElementById(id)) document.getElementById(id).classList.add('active-nav');
        }

        async function handleLogin() {
            const code = document.getElementById('input-code').value.trim().toUpperCase();
            if(!code) return;
            const adminCode = globalData.configuracion?.adminCode || "PROFE2026";
            
            if(code === adminCode) {
                currentUser = { rol: 'teacher', nombre: globalData.configuracion?.adminName || "DOCENTE" };
                startSession();
            } else {
                let found = null;
                for(let key in globalData.estudiantes) {
                    if(globalData.estudiantes[key].codigo === code) {
                        found = { ...globalData.estudiantes[key], id: key, rol: 'student' };
                        break;
                    }
                }
                if(found) { currentUser = found; startSession(); }
                else alert("Código incorrecto");
            }
        }

        function startSession() {
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-app').classList.remove('hidden');
            document.getElementById('display-name').innerText = currentUser.nombre;
            document.getElementById('avatar').innerText = currentUser.nombre.charAt(0);
            
            if(currentUser.rol === 'teacher') {
                document.getElementById('display-role').innerText = "Administrator";
                document.getElementById('nav-teacher').classList.remove('hidden');
                document.getElementById('btn-student-settings').classList.add('hidden');
                renderTeacherDashboard();
            } else {
                document.getElementById('display-role').innerText = globalData.cursos?.[currentUser.cursoId]?.nombre || "Student";
                document.getElementById('nav-student').classList.remove('hidden');
                document.getElementById('btn-student-settings').classList.remove('hidden');
                renderStudentDashboard();
            }
        }

        function scrollToTask(dateStr) {
            const taskEls = document.querySelectorAll(`.task-date-${dateStr}`);
            if(taskEls.length > 0) {
                taskEls[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
                taskEls.forEach(el => {
                    el.classList.remove('highlight-task');
                    void el.offsetWidth;
                    el.classList.add('highlight-task');
                    setTimeout(() => { el.classList.remove('highlight-task'); }, 2500);
                });
            } else {
                alert("No hay tareas registradas para esta fecha.");
            }
        }

        function renderCalendar(isTeacher = false) {
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            const year = currentMonth.getFullYear();
            const month = currentMonth.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = `
                <div class="bg-white rounded-3xl p-4 shadow-sm border border-slate-100 mb-6 max-w-3xl mx-auto">
                    <div class="flex justify-between items-center mb-4 px-2">
                        <button onclick="changeMonth(-1, ${isTeacher})" class="text-brand-teal text-2xl hover:scale-110 transition-transform"><i class="fa-solid fa-chevron-left"></i></button>
                        <h4 class="font-black text-brand-navy uppercase text-sm md:text-lg tracking-widest">${monthNames[month]} ${year}</h4>
                        <button onclick="changeMonth(1, ${isTeacher})" class="text-brand-teal text-2xl hover:scale-110 transition-transform"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                    <div class="calendar-grid mb-1">
                        ${['D','L','M','X','J','V','S'].map(d => `<div class="text-center text-xs font-black text-slate-300 uppercase">${d}</div>`).join('')}
                    </div>
                    <div class="calendar-grid">`;

            for(let i = 0; i < firstDay; i++) html += `<div></div>`;
            for(let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                
                let hasEvent = false;
                let allTasksSubmitted = true;
                let foundTasks = 0;

                for(let k in globalData.publicaciones) { 
                    const pub = globalData.publicaciones[k];
                    if(pub.fecha === dateStr) { 
                        if(isTeacher || pub.cursoId === 'all' || pub.cursoId === currentUser.cursoId) {
                            hasEvent = true; 
                            foundTasks++;
                            
                            if(!isTeacher) {
                                const miEntrega = globalData.entregas?.[k]?.[currentUser.id];
                                if(!miEntrega || !miEntrega.fecha) {
                                    allTasksSubmitted = false;
                                }
                            }
                        }
                    } 
                }
                
                const isToday = new Date().toDateString() === new Date(year, month, d).toDateString();
                
                let eventIndicator = '';
                if(hasEvent) {
                    if(!isTeacher && foundTasks > 0 && allTasksSubmitted) {
                        eventIndicator = `
                            <div class="absolute -top-1 -right-1 bg-slate-400 text-white w-[22px] h-[22px] rounded-full flex items-center justify-center text-[11px] shadow-md border-2 border-white z-10">
                                <i class="fa-solid fa-check"></i>
                            </div>`;
                    } else {
                        eventIndicator = `
                            <div class="absolute -top-1 -right-1 bg-red-500 text-white w-[22px] h-[22px] rounded-full flex items-center justify-center text-[11px] shadow-md border-2 border-white animate-bounce z-10">
                                <i class="fa-solid fa-bell"></i>
                            </div>`;
                    }
                }
                
                html += `<div ${hasEvent ? `onclick="scrollToTask('${dateStr}')"` : ''} 
                              class="calendar-day text-base md:text-lg ${isToday ? 'bg-brand-teal text-white shadow-lg' : 'bg-slate-50 text-slate-600'} 
                              ${hasEvent ? 'border-2 border-brand-yellow/50 bg-yellow-50/30 hover:bg-brand-yellow/20' : 'border-2 border-transparent hover:bg-slate-100'} transition-all">${d}${eventIndicator}</div>`;
            }
            return html + `</div></div>`;
        }

        function changeMonth(dir, isTeacher) {
            currentMonth.setMonth(currentMonth.getMonth() + dir);
            isTeacher ? renderTeacherDashboard() : renderStudentDashboard();
        }

        function renderTeacherDashboard() {
            setActiveNav('t-nav-1');
            const main = document.getElementById('app-content');
            let html = `<div class="max-w-7xl mx-auto w-full">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-black text-2xl md:text-3xl text-brand-navy uppercase italic tracking-tighter">Muro General</h3>
                    <button onclick="modalPublicar()" class="bg-brand-teal text-white p-3 md:px-6 md:py-3 rounded-xl text-sm font-black shadow-lg hover:bg-teal-400 transition-colors">+ PUBLICAR</button>
                </div>`;
            
            html += renderCalendar(true);

            const activeYear = currentMonth.getFullYear();
            const activeMonth = String(currentMonth.getMonth() + 1).padStart(2, '0');
            const activeMonthPrefix = `${activeYear}-${activeMonth}`;

            const items = globalData.publicaciones || {};
            const grouped = { 'all': [] };
            for(let id in globalData.cursos) grouped[id] = [];
            
            Object.keys(items).reverse().forEach(k => {
                const p = { ...items[k], id: k };
                if (p.fecha && p.fecha.startsWith(activeMonthPrefix)) {
                    if (p.cursoId === 'all') {
                        grouped['all'].push(p);
                    } else if (grouped[p.cursoId]) {
                        grouped[p.cursoId].push(p);
                    } else {
                        if (!grouped['deleted']) grouped['deleted'] = [];
                        grouped['deleted'].push(p);
                    }
                }
            });

            const renderGroup = (title, pubs) => {
                if (pubs.length === 0) return '';
                let gHtml = `
                    <div class="mt-8 mb-4">
                        <h4 class="font-black text-xl text-brand-navy uppercase border-b-4 border-brand-teal pb-1 inline-block"><i class="fa-solid fa-layer-group mr-2 text-brand-teal"></i> ${title}</h4>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">`;
                
                pubs.forEach(p => {
                    const k = p.id;
                    const entregas = globalData.entregas?.[k] || {};
                    const countEntregas = Object.keys(entregas).length;
                    const isEvaluable = p.categoria && p.categoria !== 'none';
                    const showHora = p.hora ? ` a las ${p.hora}` : '';

                    gHtml += `<div class="bg-white p-5 rounded-3xl shadow-sm border-l-8 ${isEvaluable ? 'border-brand-yellow' : 'border-brand-teal'} task-date-${p.fecha} relative hover:shadow-md transition-shadow flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-3 border-b pb-3">
                                <span class="text-xs font-black uppercase text-brand-teal bg-brand-teal/10 px-2 py-1 rounded w-max">Pub: ${p.fechaPublicado || 'N/A'}</span>
                                <button onclick="eliminarRegistro('publicaciones/${k}')" class="text-slate-300 text-xl hover:text-red-500 transition-colors"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                            <h4 class="font-black text-brand-navy uppercase mt-1 text-xl">${p.titulo}</h4>
                            <p class="text-sm text-slate-500 mt-2 line-clamp-3">${p.descripcion}</p>
                            ${p.linkMaterial ? `<a href="${p.linkMaterial}" target="_blank" class="block mt-4 bg-brand-teal/10 hover:bg-brand-teal hover:text-white transition-colors text-brand-teal p-3 rounded-xl text-xs font-black uppercase text-center border border-brand-teal/20"><i class="fa-solid fa-link mr-2"></i> Ver Material de Apoyo</a>` : ''}
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-50 flex justify-between items-center">
                            <span class="text-[11px] font-black text-brand-navy uppercase"><i class="fa-regular fa-clock mr-1"></i> Límite: ${p.fecha || '--'} ${showHora}</span>
                            ${isEvaluable ? `<button onclick="verEntregas('${k}')" class="bg-brand-navy hover:bg-slate-800 transition-colors text-brand-yellow px-4 py-2 rounded-xl text-xs font-black uppercase tracking-widest shadow-lg">REVISAR (${countEntregas})</button>` : ''}
                        </div>
                    </div>`;
                });
                return gHtml + `</div>`;
            };

            html += renderGroup('TODOS LOS GRUPOS (AVISOS GENERALES)', grouped['all']);
            for (let c in globalData.cursos) {
                html += renderGroup(globalData.cursos[c].nombre, grouped[c]);
            }

        async function savePublicacion() {
            const catVal = document.getElementById('p-cat').value.split('_');
            const fechaActual = new Date();
            const fechaPub = `${String(fechaActual.getDate()).padStart(2, '0')}/${String(fechaActual.getMonth() + 1).padStart(2, '0')}/${fechaActual.getFullYear()}`;
            const maxInput = Number(document.getElementById('p-max-pts').value) || 100;

            const data = {
                tipo: catVal[0] === 'none' ? 'Aviso' : 'Tarea',
                categoria: catVal[0],
                maxPts: catVal[0] === 'none' ? 0 : maxInput,
                cursoId: document.getElementById('p-cur').value,
                titulo: document.getElementById('p-tit').value.trim().toUpperCase(),
                descripcion: document.getElementById('p-desc').value.trim(),
                linkMaterial: document.getElementById('p-link-material').value.trim(),
                fechaPublicado: fechaPub,
                fecha: document.getElementById('p-fecha').value,
                hora: document.getElementById('p-hora').value || "23:59" 
            };
            if(!data.titulo || !data.fecha) return alert("Completa el título y la fecha límite.");
            await db.ref('publicaciones').push(data);
            closeModal(); renderTeacherDashboard();
        }

            const items = globalData.publicaciones || {};
            const ahora = new Date();

            const activeYear = currentMonth.getFullYear();
            const activeMonth = String(currentMonth.getMonth() + 1).padStart(2, '0');
            const activeMonthPrefix = `${activeYear}-${activeMonth}`;
            
            Object.keys(items).reverse().forEach(k => {
                const p = items[k];
                
                if(p.fecha && p.fecha.startsWith(activeMonthPrefix) && (p.cursoId === "all" || p.cursoId === currentUser.cursoId)) {
                    const miEntrega = globalData.entregas?.[k]?.[currentUser.id];
                    const isEvaluable = p.categoria && p.categoria !== 'none';

        async function enviarTarea(pubId) {
            const linkInput = document.getElementById('e-link').value.trim();
            const resElement = document.getElementById('e-res-editor');
            let res = resElement ? resElement.innerHTML.trim() : '';
            if (res === '<br>') res = ''; 

            const btnEnviar = document.getElementById('btn-enviar-tarea');
            
            if (!linkInput && !res) {
                alert("Debes pegar un link o escribir tu tarea en la hoja virtual.");
                return;
            }

            btnEnviar.disabled = true;
            btnEnviar.classList.add('opacity-50');

            try {
                await db.ref(`entregas/${pubId}/${currentUser.id}`).update({
                    alumno: currentUser.nombre,
                    respuesta: res,
                    archivo: linkInput || '',
                    fecha: new Date().toLocaleString()
                });
                alert("¡Trabajo enviado exitosamente!"); 
                closeModal(); 
                renderStudentDashboard();
            } catch (error) {
                alert("Error al enviar: " + error.message);
                btnEnviar.disabled = false;
                btnEnviar.classList.remove('opacity-50');
            }
        }

                            <i class="fa-solid fa-sliders"></i> CONFIG. PONDERACIONES

                <div id="grades-table-container"></div>

            if(!cursoId) return alert("Por favor selecciona un grupo primero.");

            openModal(`

                    <p class="text-xs font-bold text-brand-teal uppercase mb-4">Grupo: ${curso ? curso.nombre : ''}</p>
                    <div class="space-y-4">
                        <input id="tm-tit" type="text" placeholder="TÍTULO (EJ: PRÁCTICA EN CLASE #1)" class="w-full p-4 bg-slate-50 rounded-2xl font-black uppercase outline-none focus:border-brand-teal focus:bg-white transition-colors border-2 border-transparent text-sm">
                        <div>
                            <label class="text-xs font-black text-slate-400 uppercase ml-2 block mb-1">Categoría de Calificación:</label>
                            <select id="tm-cat" class="w-full p-4 bg-slate-50 rounded-2xl font-black outline-none text-sm uppercase cursor-pointer focus:border-brand-teal border border-slate-200">

                                <option value="midtermEscrito">MIDTERM ESCRITO</option>
                                <option value="midtermOral">MIDTERM ORAL</option>
                                <option value="finalEscrito">FINAL ESCRITO</option>
                                <option value="finalOral">FINAL ORAL</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-black text-slate-400 uppercase ml-2 block mb-1">Puntaje Máximo de esta Tarea / Práctica:</label>
                            <input id="tm-max" type="number" value="100" min="1" class="w-full p-4 bg-slate-50 rounded-2xl font-black outline-none text-sm focus:border-brand-teal focus:bg-white transition-colors border border-slate-200">
                        </div>
                        <button onclick="saveTareaManual('${cursoId}')" class="w-full bg-brand-teal hover:bg-teal-400 transition-colors text-white py-4 rounded-2xl font-black shadow-lg uppercase text-sm tracking-widest mt-2">Crear y Colocar en Libreta</button>
                    </div>
                </div>
            `, false);
        }

        async function saveTareaManual(cursoId) {
            const tit = document.getElementById('tm-tit').value.trim().toUpperCase();
            const cat = document.getElementById('tm-cat').value;
            const maxPts = Number(document.getElementById('tm-max').value) || 100;

            if(!tit) return alert("Por favor ingresa un título para la tarea.");

            const fechaActual = new Date();
            const fechaPub = `${String(fechaActual.getDate()).padStart(2, '0')}/${String(fechaActual.getMonth() + 1).padStart(2, '0')}/${fechaActual.getFullYear()}`;

            await db.ref('publicaciones').push({
                tipo: 'Tarea',
                categoria: cat,
                maxPts: maxPts,
                cursoId: cursoId,
                titulo: tit,
                descripcion: 'Tarea / Práctica añadida manualmente desde la libreta.',
                fechaPublicado: fechaPub,
                fecha: `${fechaActual.getFullYear()}-${String(fechaActual.getMonth() + 1).padStart(2, '0')}-${String(fechaActual.getDate()).padStart(2, '0')}`,
                hora: "23:59",
                isManual: true
            });

            closeModal();
            renderGradesTable(cursoId);
        }

        async function updateTaskGrade(taskId, estId, notaVal) {
            const est = globalData.estudiantes[estId];
            if(!est) return;
            
            if (notaVal === "" || notaVal === null) {
                await db.ref(`entregas/${taskId}/${estId}/nota`).remove();
            } else {
                await db.ref(`entregas/${taskId}/${estId}`).update({
                    alumno: est.nombre,
                    nota: Number(notaVal),
                    fecha: new Date().toLocaleString()
                });
            }
            renderGradesTable(document.getElementById('g-cur').value);
        }

        async function updateDirectGrade(estId, fieldKey, val) {
            if (val === "" || val === null) {
                await db.ref(`estudiantes/${estId}/notas/${fieldKey}`).remove();
            } else {
                await db.ref(`estudiantes/${estId}/notas/${fieldKey}`).set(Number(val));
            }
            renderGradesTable(document.getElementById('g-cur').value);
        }

        function renderGradesTable(cId) {
            const container = document.getElementById('grades-table-container');
            const actionsHeader = document.getElementById('gradebook-header-actions');
            
            if(!cId) {
                if(container) container.innerHTML = '';
                if(actionsHeader) actionsHeader.classList.add('hidden');
                return;
            }
            
            if(actionsHeader) actionsHeader.classList.remove('hidden');

            const pond = getGroupPonderaciones(cId);

            // 1. Obtener alumnos del curso
            let students = [];
            for(let eId in globalData.estudiantes) {
                if(globalData.estudiantes[eId].cursoId === cId) {
                    students.push({...globalData.estudiantes[eId], id: eId});
                }
            }
            students.sort((a, b) => a.nombre.localeCompare(b.nombre));

            if(students.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 font-bold text-sm py-10">No hay alumnos registrados en este grupo.</p>`;
                return;
            }

            // 2. Agrupar Tareas y Actividades publicadas por Categoría para este grupo
            const tasksByCat = {
                asistencia: [],
                participacion: [],
                tareas: [],
                midtermEscrito: [],
                midtermOral: [],
                finalEscrito: [],
                finalOral: []
            };

            for(let pId in globalData.publicaciones) {
                const p = globalData.publicaciones[pId];
                if((p.cursoId === cId || p.cursoId === 'all') && p.categoria && tasksByCat[p.categoria]) {
                    tasksByCat[p.categoria].push({ ...p, id: pId });
                }
            }

            // Construcción de Cabeceras
            let headers = `<th class="p-3 text-center bg-brand-navy text-white">N°</th><th class="p-3 text-left w-56 bg-brand-navy text-white">ALUMNO</th>`;

            // Asistencia
            headers += `<th class="p-3 text-center bg-slate-800 text-brand-teal" title="Asistencia (Max: ${pond.asistencia})">ASI<br>(${pond.asistencia}p)</th>`;
            
            // Participación
            headers += `<th class="p-3 text-center bg-slate-800 text-brand-teal" title="Participación (Max: ${pond.participacion})">PAR<br>(${pond.participacion}p)</th>`;

            // Tareas y Prácticas (Dinámicas)
            if (tasksByCat.tareas.length > 0) {
                tasksByCat.tareas.forEach(t => {
                    headers += `<th class="p-2 text-center bg-teal-800 text-teal-100 text-[9px] max-w-[100px] truncate border-r border-teal-700" title="${t.titulo}">${t.titulo}<br>(${t.maxPts || 100}p)</th>`;
                });
            }
            headers += `<th class="p-3 text-center bg-teal-900 text-brand-yellow" title="Tareas Ponderadas sobre ${pond.tareas} pts">POND. TAR<br>(${pond.tareas}p)</th>`;

            // Midterm Escrito
            if (tasksByCat.midtermEscrito.length > 0) {
                tasksByCat.midtermEscrito.forEach(t => {
                    headers += `<th class="p-2 text-center bg-blue-900 text-blue-100 text-[9px] max-w-[100px] truncate" title="${t.titulo}">${t.titulo}<br>(${t.maxPts || 100}p)</th>`;
                });
            } else {
                headers += `<th class="p-3 text-center bg-blue-900 text-blue-100">ME<br>(${pond.midtermEscrito}p)</th>`;
            }

            // Midterm Oral
            if (tasksByCat.midtermOral.length > 0) {
                tasksByCat.midtermOral.forEach(t => {
                    headers += `<th class="p-2 text-center bg-blue-900 text-blue-100 text-[9px] max-w-[100px] truncate" title="${t.titulo}">${t.titulo}<br>(${t.maxPts || 100}p)</th>`;
                });
            } else {
                headers += `<th class="p-3 text-center bg-blue-900 text-blue-100">MO<br>(${pond.midtermOral}p)</th>`;
            }

            // Final Escrito
            if (tasksByCat.finalEscrito.length > 0) {
                tasksByCat.finalEscrito.forEach(t => {
                    headers += `<th class="p-2 text-center bg-indigo-900 text-indigo-100 text-[9px] max-w-[100px] truncate" title="${t.titulo}">${t.titulo}<br>(${t.maxPts || 100}p)</th>`;
                });
            } else {
                headers += `<th class="p-3 text-center bg-indigo-900 text-indigo-100">FE<br>(${pond.finalEscrito}p)</th>`;
            }

            // Final Oral
            if (tasksByCat.finalOral.length > 0) {
                tasksByCat.finalOral.forEach(t => {
                    headers += `<th class="p-2 text-center bg-indigo-900 text-indigo-100 text-[9px] max-w-[100px] truncate" title="${t.titulo}">${t.titulo}<br>(${t.maxPts || 100}p)</th>`;
                });
            } else {
                headers += `<th class="p-3 text-center bg-indigo-900 text-indigo-100">FO<br>(${pond.finalOral}p)</th>`;
            }

            // Recuperatorio y Total
            headers += `<th class="p-3 text-center bg-yellow-600 text-white">REC<br>(10p)</th>`;
            headers += `<th class="p-3 text-center bg-brand-teal text-white">TOTAL</th>`;

            // Generación de Filas por Estudiante
            let tbody = '';
            students.forEach((e, index) => {
                const n = e.notas || {};
                const eId = e.id;

                const makeTaskInput = (taskId, val, maxTask) => {
                    return `<input onchange="updateTaskGrade('${taskId}', '${eId}', this.value)" type="number" min="0" max="${maxTask}" value="${val !== undefined && val !== '' ? val : ''}" class="gradebook-input w-12 h-9 text-center font-black rounded border border-slate-300 focus:border-brand-teal outline-none bg-white text-xs">`;
                };

                const makeDirectInput = (fieldKey, val, maxVal, extraClass="") => {
                    return `<input onchange="updateDirectGrade('${eId}', '${fieldKey}', this.value)" type="number" min="0" max="${maxVal}" value="${val !== undefined && val !== '' ? val : ''}" class="gradebook-input w-12 h-9 text-center font-black rounded border border-slate-300 focus:border-brand-teal outline-none bg-white text-xs ${extraClass}">`;
                };

                // Asistencia y Participación Directas
                const asiVal = n.asistencia !== undefined ? Number(n.asistencia) : 0;
                const parVal = n.participacion !== undefined ? Number(n.participacion) : 0;

                // TAREAS: Calcular suma y ponderación automática
                let tarTaskCols = '';
                let tarEarnedSum = 0;
                let tarMaxSum = 0;

                if (tasksByCat.tareas.length > 0) {
                    tasksByCat.tareas.forEach(t => {
                        const taskMax = Number(t.maxPts || 100);
                        const score = globalData.entregas?.[t.id]?.[eId]?.nota;
                        tarMaxSum += taskMax;
                        if(score !== undefined && score !== "") tarEarnedSum += Number(score);
                        tarTaskCols += `<td class="p-1 text-center bg-teal-50/30">${makeTaskInput(t.id, score, taskMax)}</td>`;
                    });
                }

                let tarPonderado = 0;
                if (tarMaxSum > 0) {
                    tarPonderado = (tarEarnedSum / tarMaxSum) * pond.tareas;
                    if (tarPonderado > pond.tareas) tarPonderado = pond.tareas;
                } else {
                    tarPonderado = n.tareas !== undefined ? Number(n.tareas) : 0;
                }
                tarPonderado = Math.round(tarPonderado * 10) / 10;

                // Función aux para procesar evaluaciones
                const processCategory = (catKey, catMax) => {
                    const tasksList = tasksByCat[catKey];
                    let cols = '';
                    let earnedSum = 0;
                    let maxSum = 0;

                    if (tasksList.length > 0) {
                        tasksList.forEach(t => {
                            const taskMax = Number(t.maxPts || 100);
                            const score = globalData.entregas?.[t.id]?.[eId]?.nota;
                            maxSum += taskMax;
                            if(score !== undefined && score !== "") earnedSum += Number(score);
                            cols += `<td class="p-1 text-center bg-slate-50">${makeTaskInput(t.id, score, taskMax)}</td>`;
                        });
                        let pondVal = maxSum > 0 ? (earnedSum / maxSum) * catMax : 0;
                        return { cols, score: Math.round(pondVal * 10) / 10 };
                    } else {
                        const directScore = n[catKey] !== undefined ? Number(n[catKey]) : 0;
                        cols = `<td class="p-1 text-center bg-slate-50">${makeDirectInput(catKey, n[catKey], catMax)}</td>`;
                        return { cols, score: directScore };
                    }
                };

                const meRes = processCategory('midtermEscrito', pond.midtermEscrito);
                const moRes = processCategory('midtermOral', pond.midtermOral);
                const feRes = processCategory('finalEscrito', pond.finalEscrito);
                const foRes = processCategory('finalOral', pond.finalOral);

                const recVal = n.recuperatorio !== undefined ? Number(n.recuperatorio) : 0;

                const baseSum = asiVal + parVal + tarPonderado + meRes.score + moRes.score + feRes.score + foRes.score;
                let total = baseSum < 55 && recVal > 0 ? Math.min(baseSum + recVal, 55) : baseSum;
                total = Math.min(100, Math.round(total * 10) / 10);

                const statusClass = total >= 55 ? 'text-brand-teal' : 'text-red-500';

                tbody += `<tr class="hover:bg-slate-100 transition-colors border-b border-slate-200">
                    <td class="p-2 text-center text-xs font-bold text-slate-400">${index + 1}</td>
                    <td class="p-2 font-black text-brand-navy text-xs md:text-sm uppercase truncate max-w-[150px] md:max-w-xs" title="${e.nombre}">${e.nombre}</td>
                    
                    <td class="p-1 text-center">${makeDirectInput('asistencia', n.asistencia, pond.asistencia)}</td>
                    <td class="p-1 text-center">${makeDirectInput('participacion', n.participacion, pond.participacion)}</td>
                    
                    ${tarTaskCols}
                    <td class="p-1 text-center bg-teal-100/50 font-black text-brand-teal text-sm">${tarPonderado}</td>
                    
                    ${meRes.cols}
                    ${moRes.cols}
                    ${feRes.cols}
                    ${foRes.cols}
                    
                    <td class="p-1 text-center bg-yellow-50">${makeDirectInput('recuperatorio', n.recuperatorio, 10, "border-yellow-300 text-yellow-600")}</td>
                    <td class="p-2 text-center bg-slate-50 border-l-2 border-slate-200 font-black ${statusClass} text-base md:text-lg">${total}</td>
                </tr>`;
            });

            container.innerHTML = `
            <div class="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                <div class="overflow-x-auto hide-scroll pb-2">
                    <table class="gradebook-table w-full text-left border-collapse min-w-max">
                        <thead class="bg-brand-navy text-brand-yellow font-black text-[9px] md:text-[10px] uppercase tracking-wider">
                            <tr>${headers}</tr>
                        </thead>
                        <tbody class="bg-white">
                            ${tbody}
                        </tbody>
                    </table>
                </div>
            </div>`;
        }

        function toggleGradeDetails() {
            const container = document.getElementById('grades-details-container');
            const icon = document.getElementById('icon-grades-toggle');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
            } else {
                container.classList.add('hidden');
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            }
        }

        // --- BOLETÍN DE ESTUDIANTE ACTUALIZADO ---
        function renderStudentGrades() {
            setActiveNav('s-nav-3');
            const main = document.getElementById('app-content');
            const e = globalData.estudiantes?.[currentUser.id] || currentUser;
            const n = e.notas || {};
            const pond = getGroupPonderaciones(e.cursoId);

            const asiVal = n.asistencia !== undefined ? Number(n.asistencia) : 0;
            const parVal = n.participacion !== undefined ? Number(n.participacion) : 0;
            const recVal = n.recuperatorio !== undefined ? Number(n.recuperatorio) : 0;

            // Tareas del alumno
            let tareasListHtml = '';
            let tarEarnedSum = 0;
            let tarMaxSum = 0;

            for(let pId in globalData.publicaciones) {
                const p = globalData.publicaciones[pId];
                if((p.cursoId === e.cursoId || p.cursoId === 'all') && p.categoria === 'tareas') {
                    const taskMax = Number(p.maxPts || 100);
                    const score = globalData.entregas?.[pId]?.[currentUser.id]?.nota;
                    tarMaxSum += taskMax;
                    if(score !== undefined && score !== "") {
                        tarEarnedSum += Number(score);
                        tareasListHtml += `<div class="flex justify-between items-center text-xs text-slate-500 py-1 pl-4"><span class="truncate w-48">• ${p.titulo}</span><span class="font-bold">${score} / ${taskMax} pts</span></div>`;
                    } else {
                        tareasListHtml += `<div class="flex justify-between items-center text-xs text-slate-400 italic py-1 pl-4"><span class="truncate w-48">• ${p.titulo}</span><span>Pendiente</span></div>`;
                    }
                }
            }

            let tarPonderado = 0;
            if(tarMaxSum > 0) {
                tarPonderado = (tarEarnedSum / tarMaxSum) * pond.tareas;
                if (tarPonderado > pond.tareas) tarPonderado = pond.tareas;
            } else {
                tarPonderado = n.tareas !== undefined ? Number(n.tareas) : 0;
            }
            tarPonderado = Math.round(tarPonderado * 10) / 10;

            // Función para calcular categoría de exámenes o directas
            const getCatScore = (catKey, catMax) => {
                let earnedSum = 0, maxSum = 0, count = 0;
                for(let pId in globalData.publicaciones) {
                    const p = globalData.publicaciones[pId];
                    if((p.cursoId === e.cursoId || p.cursoId === 'all') && p.categoria === catKey) {
                        count++;
                        const taskMax = Number(p.maxPts || 100);
                        const score = globalData.entregas?.[pId]?.[currentUser.id]?.nota;
                        maxSum += taskMax;
                        if(score !== undefined && score !== "") earnedSum += Number(score);
                    }
                }
                if (count > 0 && maxSum > 0) {
                    let score = (earnedSum / maxSum) * catMax;
                    return Math.round(score * 10) / 10;
                } else {
                    return n[catKey] !== undefined ? Number(n[catKey]) : 0;
                }
            };

            const meVal = getCatScore('midtermEscrito', pond.midtermEscrito);
            const moVal = getCatScore('midtermOral', pond.midtermOral);
            const feVal = getCatScore('finalEscrito', pond.finalEscrito);
            const foVal = getCatScore('finalOral', pond.finalOral);

            const baseSum = asiVal + parVal + tarPonderado + meVal + moVal + feVal + foVal;
            let final = baseSum < 55 && recVal > 0 ? Math.min(baseSum + recVal, 55) : baseSum;
            final = Math.min(100, Math.round(final * 10) / 10);

            let detailsHtml = `
                <div class="flex justify-between border-b border-slate-100 pb-3"><span class="text-xs font-black uppercase text-slate-500">ASISTENCIA (${pond.asistencia} PTS)</span><span class="font-black text-base md:text-lg">${asiVal}</span></div>
                <div class="flex justify-between border-b border-slate-100 pb-3"><span class="text-xs font-black uppercase text-slate-500">PARTICIPACIÓN (${pond.participacion} PTS)</span><span class="font-black text-base md:text-lg">${parVal}</span></div>
                
                <div class="border-b border-slate-100 pb-3">
                    <div class="flex justify-between items-center mb-1"><span class="text-xs font-black uppercase text-brand-teal">TAREAS Y PRÁCTICAS (${pond.tareas} PTS)</span><span class="font-black text-brand-teal text-base md:text-lg">${tarPonderado} / ${pond.tareas}</span></div>
                    ${tareasListHtml ? `<div class="bg-slate-50 p-2 rounded-xl border border-slate-100 space-y-1 mt-2">${tareasListHtml}</div>` : ''}
                </div>

                <div class="flex justify-between border-b border-slate-100 pb-3"><span class="text-xs font-black uppercase text-brand-navy">MIDTERM ESCRITO (${pond.midtermEscrito} PTS)</span><span class="font-black text-base md:text-lg">${meVal}</span></div>
                <div class="flex justify-between border-b border-slate-100 pb-3"><span class="text-xs font-black uppercase text-brand-navy">MIDTERM ORAL (${pond.midtermOral} PTS)</span><span class="font-black text-base md:text-lg">${moVal}</span></div>
                <div class="flex justify-between border-b border-slate-100 pb-3"><span class="text-xs font-black uppercase text-brand-navy">FINAL ESCRITO (${pond.finalEscrito} PTS)</span><span class="font-black text-base md:text-lg">${feVal}</span></div>
                <div class="flex justify-between border-b border-slate-100 pb-3"><span class="text-xs font-black uppercase text-brand-navy">FINAL ORAL (${pond.finalOral} PTS)</span><span class="font-black text-base md:text-lg">${foVal}</span></div>
                <div class="flex justify-between pt-2 items-center"><span class="text-xs font-black uppercase text-yellow-500">RECUPERATORIO (10 PTS)<br><span class="text-[10px] text-slate-400 block mt-1">(Para aprobar con 55 pts)</span></span><span class="font-black text-yellow-500 text-base md:text-lg">${recVal}</span></div>
            `;

            main.innerHTML = `<div class="max-w-2xl mx-auto w-full">
                <div class="text-center mt-2">
                    <h3 class="font-black text-brand-navy text-2xl md:text-3xl uppercase mb-6 md:mb-8 italic">Mis Notas</h3>
                    
                    <div class="w-48 h-48 mx-auto bg-brand-navy rounded-full flex flex-col items-center justify-center shadow-2xl border-[8px] ${final >= 55 ? 'border-brand-teal' : 'border-red-400'} mb-6 transition-all hover:scale-105">
                        <span class="text-7xl font-black text-white leading-none">${final}</span>
                        <span class="text-[11px] font-bold text-slate-300 uppercase tracking-widest mt-3">Puntos Totales</span>
                    </div>

                    <button onclick="toggleGradeDetails()" class="mx-auto flex items-center justify-center gap-2 bg-slate-100 hover:bg-slate-200 text-brand-navy font-black text-xs md:text-sm px-6 py-3 rounded-full mb-8 transition-colors uppercase shadow-sm">
                        Ver más detalles <i id="icon-grades-toggle" class="fa-solid fa-chevron-down"></i>
                    </button>

                    <div id="grades-details-container" class="hidden bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm text-left space-y-4 border border-slate-100">
                        ${detailsHtml}
                    </div>
                </div>
            </div>`;
        }

        function renderTeacherStudents() {
            setActiveNav('t-nav-2');
            const main = document.getElementById('app-content');
            let html = `<div class="max-w-7xl mx-auto w-full">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-black text-2xl md:text-3xl text-brand-navy uppercase italic">Alumnos</h3>
                    <div class="flex gap-2">
                        <button onclick="modalCargaMasiva()" class="bg-brand-yellow hover:bg-yellow-400 text-brand-navy p-3 md:px-5 md:py-3 rounded-xl text-xs md:text-sm font-black shadow-lg transition-colors"><i class="fa-solid fa-file-excel mr-1 md:mr-2"></i><span class="hidden md:inline">CARGA </span>MASIVA</button>
                        <button onclick="modalNuevoAlumno()" class="bg-brand-teal hover:bg-teal-400 transition-colors text-white p-3 md:px-5 md:py-3 rounded-xl text-xs md:text-sm font-black shadow-lg"><i class="fa-solid fa-plus mr-1 md:mr-2"></i>NUEVO <span class="hidden md:inline">ALUMNO</span></button>
                    </div>
                </div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">`;
            
            for(let id in globalData.estudiantes) {
                const e = globalData.estudiantes[id];
                html += `<div class="bg-white p-5 rounded-2xl shadow-sm flex justify-between items-center border border-slate-100 hover:shadow-md transition-shadow">
                    <div class="flex-1 min-w-0 pr-4">
                        <p class="font-black text-brand-navy text-base md:text-lg uppercase mb-2 truncate">${e.nombre}</p>
                        <p class="text-[10px] md:text-xs font-bold text-brand-teal uppercase bg-brand-teal/5 inline-block px-3 py-1.5 rounded">CÓDIGO: ${e.codigo} <span class="text-slate-300 mx-1">|</span> CURSO: ${globalData.cursos?.[e.cursoId]?.nombre || 'N/A'}</p>
                    </div>
                    <button onclick="eliminarRegistro('estudiantes/${id}')" class="text-slate-300 hover:text-red-500 transition-colors flex-shrink-0"><i class="fa-solid fa-trash text-xl md:text-2xl"></i></button>
                </div>`;
            }
            if(!globalData.estudiantes || Object.keys(globalData.estudiantes).length === 0) {
                html += `<p class="col-span-full text-center text-slate-400 font-bold text-sm py-10">No hay alumnos registrados.</p>`;
            }
            main.innerHTML = html + `</div></div>`;
        }

        function modalCargaMasiva() {
            let ops = '<option value="">-- SELECCIONA UN GRUPO --</option>';
            for(let key in globalData.cursos) ops += `<option value="${key}">${globalData.cursos[key].nombre}</option>`;
            openModal(`
                <div class="p-6 md:p-8 h-full flex flex-col">
                    <h3 class="font-black text-brand-navy text-xl md:text-2xl uppercase mb-4 italic flex-shrink-0">Carga Masiva Inteligente <i class="fa-solid fa-file-excel text-green-600 ml-2"></i></h3>
                    <div class="space-y-4 flex-1 flex flex-col min-h-0">
                        <div class="flex-shrink-0">
                            <label class="text-[11px] md:text-xs font-black text-slate-400 uppercase ml-2 block mb-1">1. Selecciona el Grupo Destino:</label>
                            <select id="masivo-cur" class="w-full p-4 bg-slate-50 rounded-2xl font-black outline-none text-sm uppercase cursor-pointer focus:border-brand-teal border border-slate-200 transition-colors">${ops}</select>
                        </div>
                        
                        <div class="flex-1 flex flex-col min-h-[30vh]">
                            <label class="text-[11px] md:text-xs font-black text-slate-400 uppercase ml-2 block mb-1 mt-2">2. Pega los datos de tus alumnos:</label>
                            <div class="bg-blue-50 p-3 rounded-xl mb-2 border border-blue-100">
                                <p class="text-[10px] md:text-xs text-blue-800 font-bold leading-tight"><i class="fa-solid fa-circle-info mr-1"></i> Formato requerido: <b>NOMBRE COMPLETO - CÓDIGO</b> (Separados por un guion -). Una fila por alumno.</p>
                            </div>
                            <textarea id="masivo-datos" placeholder="EJEMPLOS:\nJUAN CARLOS PEREZ GOMEZ - JP12345\nMARIA MAMANI CHUQUIMIA - MM456789\nLIZETH ROXANA SILVA VARGAS - 789012" class="w-full flex-1 p-4 bg-slate-50 rounded-2xl font-bold outline-none focus:bg-white focus:border-brand-teal transition-colors border border-slate-200 text-sm whitespace-pre shadow-inner resize-none"></textarea>
                        </div>
                        
                        <button id="btn-procesar-masivo" onclick="procesarCargaMasiva()" class="w-full flex-shrink-0 bg-brand-teal hover:bg-teal-400 transition-colors text-white py-4 md:py-5 rounded-2xl font-black shadow-xl mt-2 uppercase text-sm tracking-widest"><i class="fa-solid fa-upload mr-2"></i> Procesar y Registrar</button>
                    </div>
                </div>`, true); 
        }

        async function procesarCargaMasiva() {
            const cur = document.getElementById('masivo-cur').value;
            const text = document.getElementById('masivo-datos').value.trim();
            const btn = document.getElementById('btn-procesar-masivo');
            
            if(!cur) return alert("Por favor, selecciona un grupo destino en el paso 1.");
            if(!text) return alert("Pega los datos de los estudiantes en la caja de texto.");

            const lines = text.split('\n');
            let successCount = 0;
            let errors = 0;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Procesando...';
            btn.classList.add('opacity-50');

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                let nombre = '';
                let codigo = '';

                const lastHyphenIndex = line.lastIndexOf('-');
                if (lastHyphenIndex !== -1) {
                    nombre = line.substring(0, lastHyphenIndex).trim().toUpperCase();
                    codigo = line.substring(lastHyphenIndex + 1).trim().toUpperCase();
                } else {
                    let parts = line.split('\t');
                    if (parts.length < 2) parts = line.split(',');
                    if (parts.length < 2) parts = line.split(/\s{2,}/);

                    if (parts.length >= 2) {
                        codigo = parts[parts.length - 1].trim().toUpperCase();
                        parts.pop();
                        nombre = parts.join(' ').trim().toUpperCase();
                    }
                }

                if (nombre && codigo) {
                    try {
                        await db.ref('estudiantes').push({ 
                            nombre: nombre, 
                            codigo: codigo, 
                            cursoId: cur, 
                            notas: {} 
                        });
                        successCount++;
                    } catch (e) {
                        errors++;
                    }
                } else {
                    errors++;
                }
            }

            alert(`CARGA MASIVA COMPLETADA:\n\n✅ Estudiantes registrados con éxito: ${successCount}\n❌ Filas con error o formato inválido: ${errors}`);
            closeModal();
            renderTeacherStudents();
        }

        async function modalNuevoAlumno() {
            let ops = '';
            for(let key in globalData.cursos) ops += `<option value="${key}">${globalData.cursos[key].nombre}</option>`;
            openModal(`
                <div class="p-6 md:p-8">
                    <h3 class="font-black text-brand-navy text-xl md:text-2xl uppercase mb-4 italic">Nuevo Estudiante</h3>
                    <div class="space-y-4">
                        <input id="al-nom" type="text" placeholder="NOMBRE COMPLETO" class="w-full p-4 bg-slate-100 rounded-2xl font-black uppercase outline-none focus:bg-white focus:border-brand-teal transition-colors border-2 border-transparent text-sm">
                        <input id="al-cod" type="text" placeholder="CÓDIGO DE ACCESO (EJ: JUAN123)" class="w-full p-4 bg-slate-100 rounded-2xl font-black outline-none uppercase focus:bg-white focus:border-brand-teal transition-colors border-2 border-transparent text-sm">
                        <div>
                            <label class="text-xs font-black text-slate-400 uppercase ml-2 block mb-1">Asignar a Grupo:</label>
                            <select id="al-cur" class="w-full p-4 bg-slate-100 rounded-2xl font-black outline-none text-sm uppercase cursor-pointer focus:border-brand-teal border-2 border-transparent">${ops}</select>
                        </div>
                        <button onclick="saveAlumno()" class="w-full bg-brand-teal hover:bg-teal-400 transition-colors text-white py-4 rounded-2xl font-black shadow-lg mt-2 uppercase text-sm">Registrar</button>
                    </div>
                </div>`, false);
        }

        async function saveAlumno() {
            const n = document.getElementById('al-nom').value.trim().toUpperCase();
            const cod = document.getElementById('al-cod').value.trim().toUpperCase();
            const cur = document.getElementById('al-cur').value;
            if(!n || !cod || !cur) return;
            await db.ref('estudiantes').push({ nombre: n, codigo: cod, cursoId: cur, notas: {} });
            closeModal(); renderTeacherStudents();
        }

        function renderTeacherProfile() {
            setActiveNav('t-nav-5');
            const conf = globalData.configuracion || {};
            document.getElementById('app-content').innerHTML = `<div class="max-w-2xl mx-auto w-full">
                <h3 class="font-black text-2xl md:text-3xl text-brand-navy uppercase mb-6 italic">Configuración</h3>
                <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm space-y-5 border border-slate-100">
                    <div>
                        <label class="text-[11px] md:text-xs font-black text-slate-400 uppercase ml-2 block mb-2">Nombre del Docente/Admin:</label>
                        <input id="set-name" type="text" value="${conf.adminName || 'DOCENTE'}" class="w-full p-4 bg-slate-50 rounded-2xl font-black outline-none focus:border-brand-teal focus:bg-white transition-colors border-2 border-transparent text-sm">
                    </div>
                    <div>
                        <label class="text-[11px] md:text-xs font-black text-slate-400 uppercase ml-2 block mb-2">Código Maestro (Para entrar al sistema):</label>
                        <input id="set-code" type="text" value="${conf.adminCode || 'PROFE2026'}" class="w-full p-4 bg-slate-50 rounded-2xl font-black outline-none focus:border-brand-teal focus:bg-white transition-colors border-2 border-transparent text-sm">
                    </div>
                    <div>
                        <label class="text-[11px] md:text-xs font-black text-slate-400 uppercase ml-2 block mb-2">Número de WhatsApp (Sin símbolo +):</label>
                        <input id="set-wa" type="number" value="${conf.whatsapp || '591000000'}" class="w-full p-4 bg-slate-50 rounded-2xl font-black outline-none focus:border-brand-teal focus:bg-white transition-colors border-2 border-transparent text-sm">
                    </div>
                    <button onclick="saveProfile()" class="w-full bg-brand-navy hover:bg-slate-800 transition-colors text-white py-4 md:py-5 rounded-2xl font-black uppercase tracking-widest text-sm shadow-xl mt-6">Guardar Cambios</button>
                </div>
            </div>`;
        }

        async function saveProfile() {
            await db.ref('configuracion').set({
                adminName: document.getElementById('set-name').value,
                adminCode: document.getElementById('set-code').value.toUpperCase(),
                whatsapp: document.getElementById('set-wa').value
            });
            alert("Configuración Actualizada");
        }

        function modalStudentSettings() {
            openModal(`
                <div class="p-6 md:p-8">
                    <h3 class="font-black text-brand-navy text-xl md:text-2xl uppercase mb-4 italic"><i class="fa-solid fa-gear text-brand-teal mr-2"></i> Mi Cuenta</h3>
                    <div class="space-y-4">
                        <p class="text-sm text-slate-500 font-bold mb-2">Ingresa tu nuevo PIN o identificador para ingresar al campus. ¡Anótalo para no olvidarlo!</p>
                        <div>
                            <label class="text-[11px] md:text-xs font-black text-slate-400 uppercase ml-2 block mb-2">Nuevo Identificador / PIN:</label>
                            <input id="new-student-pin" type="text" placeholder="EJ: MARIA2026" value="${currentUser.codigo}" class="w-full p-4 bg-slate-50 rounded-2xl font-black uppercase outline-none focus:border-brand-teal focus:bg-white transition-colors border border-slate-200 text-sm">
                        </div>
                        <button onclick="saveStudentPin()" class="w-full bg-brand-teal hover:bg-teal-400 transition-colors text-white py-4 rounded-2xl font-black uppercase tracking-widest text-sm shadow-xl mt-4">Actualizar PIN</button>
                    </div>
                </div>`, false);
        }

        async function saveStudentPin() {
            const newPin = document.getElementById('new-student-pin').value.trim().toUpperCase();
            if(!newPin) return alert("Ingresa un PIN válido.");
            await db.ref(`estudiantes/${currentUser.id}`).update({ codigo: newPin });
            currentUser.codigo = newPin;
            alert("¡PIN actualizado con éxito!");
            closeModal();
        }

        function openModal(html, fullScreen = false) {
            const overlay = document.getElementById('modal-overlay');
            const box = document.getElementById('modal-box');
            const content = document.getElementById('modal-content');

            if (fullScreen) {
                box.className = "bg-white relative shadow-2xl flex flex-col transition-all duration-300 w-full h-full rounded-none overflow-hidden";
            } else {
                box.className = "bg-white relative shadow-2xl flex flex-col transition-all duration-300 w-[95vw] md:max-w-4xl max-h-[90vh] rounded-2xl md:rounded-[2rem] overflow-hidden";
            }

            content.innerHTML = html;
            overlay.classList.remove('hidden');
            history.pushState({ modalOpen: true }, "");
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
        }

        async function eliminarRegistro(path) {
            if(confirm("¿Estás seguro de que deseas eliminar este registro?")) {
                await db.ref(path).remove();
            }
        }
    </script>
</body>
</html>
